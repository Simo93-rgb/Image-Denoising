[project]
name = "fashion-mnist-denoiser"
version = "0.1.0"
description = "Autoencoder pipeline for image denoising on Fashion MNIST"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "pillow>=10.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "torchmetrics>=1.8.2",  # Per calcolare PSNR e SSIM
    "seaborn>=0.13.2",      # Visualizzazione loss/metriche
    "jupyter",
    "ipywidgets",
    "tensorboard>=2.16.0",
    "colorama>=0.4.6",
    "kagglehub>=0.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.0.0",
]

[tool.uv]
# Configurazione specifica per CUDA 12.1 (Ottimizzata per RTX 4090)
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Mapping dei pacchetti sull'indice CUDA
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
pythonpath = ["."]
